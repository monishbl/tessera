# Deploys tessera.monishbl.in (site/) when it changes on main.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare → My Profile →
# API Tokens → "Edit Cloudflare Workers" template, account and zone monishbl.in).
name: Site
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:
# (the token reads the code, nothing more; wrangler and the actions pinned:
# never whatever is newest that minute next to the Cloudflare token)
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build the settings package
        run: site/build.sh
      - name: Deploy
        run: npx -y wrangler@4.160.0 deploy --config site/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
